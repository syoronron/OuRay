<!-- C案「座席表の荷台」：荷台がパレット枠のマス目（飛行機の座席表のよう）。埋まった枠は青、空いた枠は白 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <!-- 荷台の外枠 -->
  <rect x="2" y="6" width="40" height="28" rx="4" fill="#fff" stroke="#033b7d" stroke-width="3"/>
  <!-- パレット枠（3列×2段） -->
  <rect x="7"  y="11" width="9" height="8" rx="1.5" fill="#0058aa"/>
  <rect x="18" y="11" width="9" height="8" rx="1.5" fill="#0058aa"/>
  <rect x="29" y="11" width="9" height="8" rx="1.5" fill="none" stroke="#0058aa" stroke-width="1.8"/>
  <rect x="7"  y="21" width="9" height="8" rx="1.5" fill="#0058aa"/>
  <rect x="18" y="21" width="9" height="8" rx="1.5" fill="none" stroke="#0058aa" stroke-width="1.8"/>
  <rect x="29" y="21" width="9" height="8" rx="1.5" fill="none" stroke="#0058aa" stroke-width="1.8"/>
  <!-- 運転席 -->
  <path d="M44 14h8l8 9v11H44z" fill="#033b7d" stroke="#033b7d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M48 17h3.5l5 5.5H48z" fill="#fff"/>
  <!-- 車輪 -->
  <circle cx="13" cy="38" r="5" fill="#033b7d"/>
  <circle cx="13" cy="38" r="2" fill="#fff"/>
  <circle cx="52" cy="38" r="5" fill="#033b7d"/>
  <circle cx="52" cy="38" r="2" fill="#fff"/>
</svg>
