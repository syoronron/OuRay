<!-- D案「Uターンの道」：行きの道が折り返して帰りの道になる「U」の形。帰りの道に小さなトラック。O と U で OuRay -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 道（太いU字）：上が行き、下が帰り -->
  <path d="M6 16 H40 A16 16 0 0 1 40 48 H6" fill="none" stroke="#033b7d" stroke-width="12" stroke-linecap="round"/>
  <!-- 道の中央線 -->
  <path d="M8 16 H40 A16 16 0 0 1 40 48 H8" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="4 4"/>
  <!-- 帰りの道を走るトラック（左向き） -->
  <rect x="17" y="38" width="15" height="10" rx="2" fill="#0058aa" stroke="#fff" stroke-width="1.5"/>
  <path d="M16 41h-5l-3 3.5V48h8z" fill="#0058aa" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="13" cy="50" r="2.6" fill="#fff" stroke="#0058aa" stroke-width="1.6"/>
  <circle cx="27" cy="50" r="2.6" fill="#fff" stroke="#0058aa" stroke-width="1.6"/>
</svg>
